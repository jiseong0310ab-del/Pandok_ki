name: SAYNUE mobile UI preview (no Vercel)
on:
  push:
    branches: [dev-preview]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'preview/**'
      - 'scripts/build-ui-preview.mjs'
      - 'tests/preview-build.test.mjs'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saynue-static-ui-preview
  cancel-in-progress: true

jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check demo-only scripts
        run: |
          node --check preview/demo-api.js
          node --check scripts/build-ui-preview.mjs
          node --check assets/screenshot-editor.js
      - name: Build isolated static UI with no secret keys or API calls
        run: node scripts/build-ui-preview.mjs
      - name: Verify static paths, privacy, and demo-only behavior
        run: node --test tests/preview-build.test.mjs
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages_preview
      - name: Publish review site
        id: publish
        uses: actions/deploy-pages@v4

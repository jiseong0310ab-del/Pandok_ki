name: SAYNUE quality and privacy checks
on:
  push:
    branches: [main, migration/cloudflare-saynue]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check lib/persona-analysis.mjs
      - run: node --check lib/server-guard.mjs
      - run: node --check lib/coaching-rubric.mjs
      - run: node --check assets/app.js
      - run: node --check tests/server-guard.test.mjs
      - run: node --check tests/e2e-mobile.test.mjs
      - run: node --check tests/page-source.mjs
      - run: node --check tests/followup.test.mjs
      - run: node --check tests/personas.test.mjs
      - run: node --check tests/mobile-focus.test.mjs
      - run: node --check api/analyze.mjs
      - run: node --check api/feedback.mjs
      - run: node --check tests/quality.test.mjs
      - run: node --check tests/feedback.test.mjs
      - run: node --check tests/monetization.test.mjs
      - run: node --check assets/screenshot-editor.js
      - run: node --check assets/situation-library.js
      - run: node --check api/simulate.mjs
      - run: node --check api/metrics.mjs
      - run: node --check assets/usage-metrics.js
      - run: node --check assets/reply-style.js
      - run: node --check tests/usage-metrics.test.mjs
      - run: node --check tests/situations-rehearsal.test.mjs
      - run: node --check tests/screenshot-editor.test.mjs
      - run: node --check lib/plus-coach.mjs
      - run: node --check assets/plus-preview.js
      - run: node --check tests/plus-coach.test.mjs
      - run: node --check lib/paddle-billing.mjs
      - run: node --check lib/saynue-auth.mjs
      - run: node --check lib/saynue-storage.mjs
      - run: node --check api/webhooks/paddle.mjs
      - run: node --check api/auth/start.mjs
      - run: node --check api/auth/verify.mjs
      - run: node --check api/auth/link-session.mjs
      - run: node --check api/auth/logout.mjs
      - run: node --check api/auth/state.mjs
      - run: node --check api/plus/report.mjs
      - run: node --check api/plus/checkout.mjs
      - run: node --check assets/account.js
      - run: node --check tests/billing-auth.test.mjs
      - name: Free analysis smoke tests
        run: node --test --test-reporter=spec tests/smoke.mjs
      - name: Mobile UX information hierarchy tests
        run: node --test --test-reporter=spec tests/mobile-focus.test.mjs
      - name: Persona specialist tests
        run: node --test --test-reporter=spec tests/personas.test.mjs
      - name: Free analysis quality tests
        run: node --test --test-reporter=spec tests/quality.test.mjs
      - name: Feedback tests
        run: node --test --test-reporter=spec tests/feedback.test.mjs
      - name: Monetization safety tests
        run: node --test --test-reporter=spec tests/monetization.test.mjs
      - name: Screenshot editor tests
        run: node --test --test-reporter=spec tests/screenshot-editor.test.mjs
      - name: Plus coaching tests
        run: node --test --test-reporter=spec tests/plus-coach.test.mjs
      - name: Billing authentication and webhook tests
        run: node --test --test-reporter=spec tests/billing-auth.test.mjs
      - name: Follow-up context and privacy tests
        run: node --test --test-reporter=spec tests/followup.test.mjs
      - name: Situation library and reply rehearsal tests
        run: node --test --test-reporter=spec tests/situations-rehearsal.test.mjs
      - name: Opt-in metrics and style personalization tests
        run: node --test --test-reporter=spec tests/usage-metrics.test.mjs
      - name: Shared server guards, Plus retries and abuse limits
        run: node --test --test-reporter=spec tests/server-guard.test.mjs
  e2e:
    # Real Chromium on a phone viewport. Files are served from the checkout and
    # every API is mocked: no secrets, no Gemini calls, no external requests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Mobile browser end-to-end tests
        run: node --test --test-reporter=spec tests/e2e-mobile.test.mjs
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cloudflare.test.mjs
      - run: node scripts/build-cloudflare.mjs
      - run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-build
